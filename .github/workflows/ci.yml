name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-base.txt
          pip install pytest flake8

      - name: Lint
        run: flake8 QuantumTrader/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: pytest QuantumTrader/tests/ -v --tb=short
